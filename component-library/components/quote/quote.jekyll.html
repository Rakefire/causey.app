<figure class="{{c}}__inner-wrapper
			component">
	{% if include.image %}
	<div class="{{c}}__image-wrapper">
		<img src="{{ include.image }}" alt="" />
	</div>
	{% endif %}
	<div class="{{c}}__content-wrapper">
		<blockquote class="{{c}}__quote"><p>{{ include.quote_text }}</p></blockquote>
		<figcaption class="{{c}}__quote-details">
			<span class="{{c}}__name">{{ include.name }}</span>
			{% if include.role %}<span class="{{c}}__role">{{ include.role }}</span>{% endif %}
		</figcaption>
	</div>
</figure>
