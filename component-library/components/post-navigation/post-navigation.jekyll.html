{% assign c = "c-post-navigation" %}
{% if page.previous.url or page.next.url %}
<nav class="{{c}}__inner-wrapper" aria-label="More posts">
	{% if page.previous.url %}
		<a class="{{c}}__option {{c}}__option--prev" href="{{ page.previous.url }}">
			<span class="{{c}}__label">Older post</span>
			<span class="{{c}}__title">{{ page.previous.title }}</span>
		</a>
	{% endif %}
	{% if page.next.url %}
		<a class="{{c}}__option {{c}}__option--next" href="{{ page.next.url }}">
			<span class="{{c}}__label">Newer post</span>
			<span class="{{c}}__title">{{ page.next.title }}</span>
		</a>
	{% endif %}
</nav>
{% endif %}
